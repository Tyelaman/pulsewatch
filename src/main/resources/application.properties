spring.application.name=pulsewatch

# AI provider: ollama or groq
pulsewatch.ai.provider=${AI_PROVIDER:ollama}

# Local Ollama configuration
pulsewatch.ai.ollama.url=http://localhost:11434
pulsewatch.ai.ollama.model=llama3.2:3b

# Cloud Groq configuration
pulsewatch.ai.groq.url=https://api.groq.com/openai/v1
pulsewatch.ai.groq.model=openai/gpt-oss-20b
pulsewatch.ai.groq.api-key=${GROQ_API_KEY:}

# Server configuration
server.port=${PORT:8080}

# Demo monitoring configuration
pulsewatch.demo.url=${DEMO_URL:http://localhost:${server.port}/demo/target}